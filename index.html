<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS de Lavado</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .app {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 30px 20px;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
      font-size: 32px;
    }

    .subtitle {
      margin-bottom: 35px;
      color: #666;
    }

    .menu {
      display: grid;
      gap: 15px;
    }

    button {
      width: 100%;
      padding: 20px;
      border: none;
      border-radius: 14px;
      background: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    button:hover {
      transform: translateY(-1px);
    }
  </style>
</head>

<body>

  <main class="app">

    <h1>🧭 GPS DE LAVADO</h1>

    <p class="subtitle">¿Qué necesitás hacer?</p>

    <div class="menu">

      <button>🚉 RECORRER EL GPS</button>

      <button>📸 ESCÁNER GPS</button>

      <button>🔍 BUSCAR</button>

    </div>

  </main>

</body>
</html>
